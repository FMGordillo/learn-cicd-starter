name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    permissions:
      contents: 'read'
      id-token: 'write'
    name: Deploy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: Build
        run: (sh ./scripts/buildprod.sh)

      - name: 'Build into GCloud'
        run: 'gcloud builds submit --tag europe-west9-docker.pkg.dev/notely-508113/notely-ar-repo/notely:latest .'

      - name: Install goose
        run: (go install github.com/pressly/goose/v3/cmd/goose@latest)

      - name: Migrate
        run: (sh ./scripts/migrateup.sh)

      - name: Deploy
        run: 'gcloud run deploy notely --image europe-west9-docker.pkg.dev/notely-508113/notely-ar-repo/notely:latest --region europe-west9 --allow-unauthenticated --project notely-508113 --max-instances=4'
